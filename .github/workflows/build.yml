# Pages serves main:/docs, and docs/index.html, docs/lessons/ and
# docs/sitemap.xml are generated — so every push that touches a source file
# rebuilds them and commits the result back to main.
name: build

on:
  push:
    branches: [main]
    paths:
      - index.html
      - build.mjs
      - css/**
      - js/**
      # The installable-app sources: the manifest is copied into docs/, sw.js is
      # stamped and minified into it, and the icons are drawn by build.mjs.
      - manifest.webmanifest
      - sw.js
      # The lesson sources: their pages are bundled into docs/lessons/ and the
      # sitemap is read off the archive index's links. The step below writes
      # docs/ only, and no docs/ path is listed here, so the commit-back cannot
      # retrigger this.
      - lessons/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

# A queued run would rebuild the same tree twice; keep the last one only.
concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No dependencies to install; build.mjs syntax-checks what it emits and
      # exits non-zero rather than shipping a corrupt bundle.
      - run: node build.mjs

      - name: commit the generated docs files when they changed
        run: |
          if git diff --quiet -- docs; then
            echo "bundle already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "build: refresh docs bundle for ${GITHUB_SHA:0:7}"
          git push
